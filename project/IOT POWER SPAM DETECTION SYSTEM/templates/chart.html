    .chart { width: 900px; height: 500px; margin: 0 auto 8px; }
    .counts { text-align:center; font-size: 14px; color:#fff; margin: 8px 0 16px; }
    .counts .badge { display:inline-block; background: rgba(255,255,255,.15); border-radius: 999px; padding: 6px 10px; margin: 0 6px; }
    .counts a { color:#ffeb3b; text-decoration: underline; margin-left: 12px; }
  </style>

  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script type="text/javascript">
    google.charts.load('current', {packages:['corechart']});
    google.charts.setOnLoadCallback(drawChart);
    function drawChart() {
      var data = google.visualization.arrayToDataTable([
        ['class', 'count'],
        ['No spam', {{ no_spam_pct }}],
        ['spam', {{ spam_pct }}]
      ]);
      var options = { title: '', is3D: true };
      var chart = new google.visualization.PieChart(document.getElementById('piechart_3d'));
      chart.draw(data, options);
    }
  </script>
