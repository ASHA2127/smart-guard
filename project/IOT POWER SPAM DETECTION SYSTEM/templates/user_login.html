<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; }
    .bg { position: fixed; inset: 0; background: url('{{ bg_url }}') no-repeat center center fixed; background-size: cover; z-index: -1; }
    .nav { background: #070707; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-weight: 700; }
    .links a { color: #ccc; margin-left: 24px; text-decoration: none; font-size: 16px; }
    .links a:hover { color: #fff; }
    .hero { background:#0a0a0a; color:#fff; text-align:center; padding: 12px 20px; }
    .hero h1 { margin:0; font-size: 20px; }
    .hero h4 { margin:0; font-size: 14px; }
    .content { display:flex; justify-content:center; align-items:flex-start; min-height: auto; padding: 16px 20px; }
    .card { width: 520px; max-width: 92vw; background: rgba(0,0,0,.55); padding: 24px; border-radius: 10px; color: #fff; }
    .card h2 { margin: 0 0 16px; text-align: center; font-size: 16px; text-transform: uppercase; }
    .form-group { margin-bottom: 14px; display:grid; grid-template-columns: 170px 1fr; align-items:center; gap:12px; }
    label { margin:0; font-weight:700; color:#000; background: rgba(255,255,255,.9); display:flex; align-items:center; min-height: 44px; padding: 0 16px; border-radius:6px; }
    input[type=text], input[type=password], input[type=email], input[type=tel] { min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; margin-top: 12px; background: #007bff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight:700; }
    .btn:hover { background: #0069d9; }
    .msg { margin-top: 12px; font-weight: 700; text-align:center; }
    .error { color: #ffdddd; }
    .success { color: #b2ffb2; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="nav">
    <div class="brand">Smart Guard</div>
    <div class="links">
      <a href="/">Home</a>
      <a href="/user_register">User Register</a>
    </div>
  </div>
  <div class="hero">
    <h1>IOT POWER SPAM DETECTION SYSTEM</h1>
    <!-- <h4>using machine learning</h4> -->
  </div>
  <div class="content">
    <div class="card">
      <h2>Enter Credentials</h2>
      <form id="userLoginForm">
        <div class="form-group">
          <label for="username">User Name</label>
          <input type="text" id="username" required placeholder="Enter user name" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter password" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$" title="Min 8 chars with upper, lower, number and special" />
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <div style="margin-top:10px; text-align:center;">
        <a href="#" id="forgotUser" style="color:#ffeb3b; font-weight:700;">Forgot password?</a>
      </div>
      <form id="resetUserForm" style="display:none; margin-top:12px;">
        <div class="form-group">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" placeholder="Enter email" required pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" title="Enter a valid email like name@example.com" />
        </div>
        <div class="form-group">
          <label for="resetPhone">Phone</label>
          <input type="tel" id="resetPhone" placeholder="Enter phone" required pattern="^[0-9]{10}$" title="Enter exactly 10 digits" />
        </div>
        <div class="form-group">
          <label for="resetPwd">New Password</label>
          <input type="password" id="resetPwd" placeholder="Enter new password" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$" title="Min 8 chars with upper, lower, number and special" />
        </div>
        <button type="submit" class="btn">Reset Password</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <script>
    (function(){
      var form = document.getElementById('userLoginForm');
      var msg = document.getElementById('msg');
      var forgotEl = document.getElementById('forgotUser');
      var resetForm = document.getElementById('resetUserForm');
      var loginPwd = document.getElementById('password');
      var resetEmail = document.getElementById('resetEmail');
      var resetPhone = document.getElementById('resetPhone');
      var resetPwd = document.getElementById('resetPwd');
      var emailRe = new RegExp('^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$');
      var phoneRe = new RegExp('^[0-9]{10}$');
      var strongRe = new RegExp('^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{8,}$');
      loginPwd.addEventListener('input', function(){ if(strongRe.test(loginPwd.value)){ loginPwd.setCustomValidity(''); } else { loginPwd.setCustomValidity('Min 8 with upper, lower, number and special'); } });
      resetEmail.addEventListener('input', function(){ var v=(resetEmail.value||'').trim(); if(emailRe.test(v)){ resetEmail.setCustomValidity(''); } else { resetEmail.setCustomValidity('Enter a valid email like name@example.com'); } });
      resetPhone.addEventListener('input', function(){ var v=(resetPhone.value||'').trim(); if(phoneRe.test(v)){ resetPhone.setCustomValidity(''); } else { resetPhone.setCustomValidity('Enter exactly 10 digits'); } });
      resetPwd.addEventListener('input', function(){ if(strongRe.test(resetPwd.value)){ resetPwd.setCustomValidity(''); } else { resetPwd.setCustomValidity('Min 8 with upper, lower, number and special'); } });
      form.addEventListener('submit', function(e){
        e.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var payload = {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        };
        msg.textContent = '';
        msg.className = 'msg';
        var apiUrl = (window.location.origin && window.location.origin.startsWith('http')) ? '/api/user_login' : 'http://127.0.0.1:5000/api/user_login';
        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(function(res){ return res.json().then(function(d){ return {ok:res.ok, status:res.status, d:d}; }); })
        .then(function(out){
          if (out.ok){
            msg.textContent = out.d.message || 'Login allowed';
            msg.classList.add('success');
            setTimeout(function(){ window.location.href = '/upload1'; }, 500);
          } else {
            msg.textContent = out.d.message || 'Login not allowed';
            msg.classList.add('error');
          }
        })
        .catch(function(){ msg.textContent = 'Network error'; msg.classList.add('error'); });
      });
      forgotEl.addEventListener('click', function(e){ e.preventDefault(); resetForm.style.display = resetForm.style.display==='none' ? 'block' : 'none'; });
      resetForm.addEventListener('submit', function(e){
        e.preventDefault();
        if (!resetForm.checkValidity()) { resetForm.reportValidity(); return; }
        var payload = {
          email: (document.getElementById('resetEmail').value||'').trim(),
          phone: (document.getElementById('resetPhone').value||'').trim(),
          newPassword: (document.getElementById('resetPwd').value||'').trim()
        };
        msg.textContent = '';
        msg.className = 'msg';
        fetch('/api/user_reset_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(function(res){ return res.json().then(function(d){ return {ok:res.ok, status:res.status, d:d}; }); })
        .then(function(out){
          if (out.ok){
            msg.textContent = out.d.message || 'Password reset successful';
            msg.classList.add('success');
            resetForm.reset();
            resetForm.style.display = 'none';
          } else {
            msg.textContent = out.d.message || 'Password reset failed';
            msg.classList.add('error');
          }
        })
        .catch(function(){ msg.textContent = 'Network error'; msg.classList.add('error'); });
      });
    })();
  </script>
</body>
</html>
